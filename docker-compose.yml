services:
  server:
    build:
      context: .
      target: server
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
      args:
        # The browser (not the container) opens this WebSocket, so use the host-published port
        VITE_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped
